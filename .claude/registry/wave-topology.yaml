# yaml-language-server: $schema=./wave-topology.schema.json
manifest:
  version: 2
  description: "Mandatory peer list and phase gate rules for session-* teams"
session_prefix: "session-*"
mandatory_peers:
  # deprecated alias — equals the HARNESS floor; kept for one-release grace period.
  # Use class_floors: HARNESS for new consumers.
  - arch-platform
  - arch-testing
  - arch-integration
  - planner
  - context-provider
  - doc-updater
  - quality-gater
class_floors:
  HARNESS:
    - arch-platform
    - arch-testing
    - arch-integration
    - planner
    - context-provider
    - doc-updater
    - quality-gater
  DOC:
    - arch-platform
    - context-provider
    - doc-updater
    - quality-gater
  FAST-PATH:
    - context-provider
default_class: HARNESS
phase_gates:
  plan_required_before_arch_dispatch: true
  quality_gate_required_before_push: true
  # FIND-17 fix (BL-W42 PR1): sentinel moved from gitignored .planning/wave-*/
  # to tracked .claude/wave-quality-gates/ directory.
  sentinel_dir: ".claude/wave-quality-gates"
  sentinel_filename_template: "{slug}.md"
