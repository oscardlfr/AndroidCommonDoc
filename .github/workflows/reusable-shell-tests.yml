name: Shell Script Tests

on:
  workflow_call:

jobs:
  bats:
    name: bats shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bats
        run: |
          npm install bats
          npx bats --version

      - name: Install kmp-test-runner
        run: npm install -g kmp-test-runner@0.14.0

      - name: Run shell tests
        run: |
          # Authoritative bats result: count "^not ok" lines (npx bats can exit 0 even
          # with failures in some edge cases). Inlined here (not the run-bats wrapper) so
          # this reusable stays portable for consumer repos that have shell tests
          # but lack the L0 toolkit scripts — see the session-coverage.bats invariant
          # "reusable workflows ... all have L0 clone fallback". The wrapper is the
          # local-dev/quality-gater equivalent; here the same check is self-contained.
          #
          # Target directory: scripts/tests — identical to run-bats.sh default targets.
          # CI-PARITY: keep this completeness logic identical to
          #   scripts/sh/run-bats.sh — pinned by scripts/tests/ci-bats-parity.bats
          npx bats scripts/tests | tee scripts/tests/bats-output.log || true
          # Strip \r before all greps (CRLF safety on Windows-produced logs)
          clean_log=$(tr -d '\r' < scripts/tests/bats-output.log)
          not_ok=$(echo "$clean_log" | grep -c "^not ok" || true)
          ok_ct=$(echo "$clean_log" | grep -c "^ok " || true)
          echo "bats: ${ok_ct:-0} ok, ${not_ok:-0} not-ok"
          if [ "${not_ok:-0}" -gt 0 ] || [ "${ok_ct:-0}" -eq 0 ]; then
            echo "::error::bats failures (${not_ok:-0} not-ok) or no run evidence (${ok_ct:-0} ok)"
            exit 1
          fi
          # Completeness assertion: total must equal the plan line 1..N
          # Leading ^ anchor required; trailing $ omitted (CRLF safety).
          plan_count=$(echo "$clean_log" | grep -c "^1\.\.[0-9]" || true)
          if [ "${plan_count:-0}" -ne 1 ]; then
            echo "::error::expected exactly one ^1..N plan line, found ${plan_count:-0}"
            exit 1
          fi
          expected=$(echo "$clean_log" | grep "^1\.\.[0-9]" | sed 's/^1\.\.\([0-9][0-9]*\).*/\1/')
          total=$(( ${ok_ct:-0} + ${not_ok:-0} ))
          if [ "$total" -ne "${expected:-0}" ]; then
            echo "::error::completeness check failed — ran $total / expected ${expected:-0} (partial or truncated run)"
            exit 1
          fi
          # bats warning: Executed X instead of expected Y tests (teardown race or over-count)
          if echo "$clean_log" | grep -q "bats warning: Executed"; then
            echo "::error::bats emitted 'Executed instead of expected' warning — test count mismatch"
            exit 1
          fi
          echo "bats completeness OK: $total / $expected (complete)"

      - name: Run Node.js hook tests
        run: |
          set -e
          # SKIP_PATTERNS: keep empty unless a test ships drifted and needs a temporary skip.
          # BL-W37 PR4 (BL-W34-E) re-enabled context-provider-consulted/gate tests after
          # observability fix landed; both pass clean.
          SKIP_PATTERNS=()
          for f in scripts/tests/*.test.js; do
            skip=0
            for pat in "${SKIP_PATTERNS[@]}"; do
              if [[ "$f" == *"$pat"* ]]; then skip=1; break; fi
            done
            if [[ $skip -eq 1 ]]; then echo "SKIP $f"; continue; fi
            echo "Running $f..."
            node "$f"
          done

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: bats-results
          path: scripts/tests/
          retention-days: 7
