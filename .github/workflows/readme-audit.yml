name: README Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:
    inputs:
      readme_path:
        description: "Path to the README file to audit"
        type: string
        default: "README.md"
      # Skills
      skills_dir:
        description: "Directory containing skill subdirectories"
        type: string
        default: "skills/"
      skills_exclude_pattern:
        description: "grep -v pattern to exclude from skills count"
        type: string
        default: "registry|params|schema"
      check_skills:
        description: "Whether to check skills count"
        type: boolean
        default: true
      # Registry
      registry_path:
        description: "Path to skills/registry.json"
        type: string
        default: "skills/registry.json"
      check_registry:
        description: "Whether to check registry entries count"
        type: boolean
        default: true
      # Agents
      agents_dir:
        description: "Directory containing agent markdown files"
        type: string
        default: ".claude/agents/"
      check_agents:
        description: "Whether to check agents count"
        type: boolean
        default: true
      # Detekt rules
      detekt_rules_dir:
        description: "Directory containing hand-written Detekt rule .kt files"
        type: string
        default: "detekt-rules/src/main/kotlin/com/androidcommondoc/detekt/rules/"
      check_detekt_rules:
        description: "Whether to check Detekt rules count"
        type: boolean
        default: true
      # MCP tools
      mcp_tools_dir:
        description: "Directory containing MCP tool .ts files"
        type: string
        default: "mcp-server/src/tools/"
      check_mcp_tools:
        description: "Whether to check MCP tools count"
        type: boolean
        default: true
      # Reusable workflows
      reusable_wf_pattern:
        description: "Glob pattern for reusable workflow files"
        type: string
        default: ".github/workflows/reusable-*.yml"
      check_reusable_wf:
        description: "Whether to check reusable workflows count"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  readme-audit:
    name: Verify README counts are current
    runs-on: ubuntu-latest
    env:
      ACD_INPUT_CHECK_SKILLS: ${{ inputs.check_skills }}
      ACD_INPUT_SKILLS_DIR: ${{ inputs.skills_dir }}
      ACD_INPUT_SKILLS_EXCLUDE_PATTERN: ${{ inputs.skills_exclude_pattern }}
      ACD_INPUT_CHECK_REGISTRY: ${{ inputs.check_registry }}
      ACD_INPUT_REGISTRY_PATH: ${{ inputs.registry_path }}
      ACD_INPUT_CHECK_AGENTS: ${{ inputs.check_agents }}
      ACD_INPUT_AGENTS_DIR: ${{ inputs.agents_dir }}
      ACD_INPUT_CHECK_DETEKT_RULES: ${{ inputs.check_detekt_rules }}
      ACD_INPUT_DETEKT_RULES_DIR: ${{ inputs.detekt_rules_dir }}
      ACD_INPUT_CHECK_MCP_TOOLS: ${{ inputs.check_mcp_tools }}
      ACD_INPUT_MCP_TOOLS_DIR: ${{ inputs.mcp_tools_dir }}
      ACD_INPUT_CHECK_REUSABLE_WF: ${{ inputs.check_reusable_wf }}
      ACD_INPUT_REUSABLE_WF_PATTERN: ${{ inputs.reusable_wf_pattern }}
      ACD_INPUT_README_PATH: ${{ inputs.readme_path }}

    steps:
      - uses: actions/checkout@v5

      - name: Gather actual counts
        id: counts
        run: |
          # Skills
          if [ "${ACD_INPUT_CHECK_SKILLS:-true}" = "true" ] && [ -d "${ACD_INPUT_SKILLS_DIR:-skills/}" ]; then
            SKILLS=$(ls "${ACD_INPUT_SKILLS_DIR:-skills/}" \
              | grep -vE "${ACD_INPUT_SKILLS_EXCLUDE_PATTERN:-registry|params|schema}" \
              | wc -l | tr -d ' ')
          else
            SKILLS="skip"
          fi

          # Registry
          ACD_REGISTRY_PATH_RESOLVED="${ACD_INPUT_REGISTRY_PATH:-skills/registry.json}"
          if [ "${ACD_INPUT_CHECK_REGISTRY:-true}" = "true" ] && [ -f "$ACD_REGISTRY_PATH_RESOLVED" ]; then
            REGISTRY=$(ACD_REGISTRY_PATH_RESOLVED="$ACD_REGISTRY_PATH_RESOLVED" python3 -c "
          import json, os
          d = json.load(open(os.environ['ACD_REGISTRY_PATH_RESOLVED']))
          entries = d.get('skills', d.get('entries', []))
          print(len(entries))")
          else
            REGISTRY="skip"
          fi

          # Agents
          if [ "${ACD_INPUT_CHECK_AGENTS:-true}" = "true" ] && [ -d "${ACD_INPUT_AGENTS_DIR:-.claude/agents/}" ]; then
            AGENTS=$(ls "${ACD_INPUT_AGENTS_DIR:-.claude/agents/}" | wc -l | tr -d ' ')
          else
            AGENTS="skip"
          fi

          # Detekt rules
          ACD_DETEKT_RULES_DIR_RESOLVED="${ACD_INPUT_DETEKT_RULES_DIR:-detekt-rules/src/main/kotlin/com/androidcommondoc/detekt/rules/}"
          if [ "${ACD_INPUT_CHECK_DETEKT_RULES:-true}" = "true" ] && [ -d "$ACD_DETEKT_RULES_DIR_RESOLVED" ]; then
            RULES=$(ls "$ACD_DETEKT_RULES_DIR_RESOLVED"*.kt 2>/dev/null \
              | grep -v generated | wc -l | tr -d ' ')
          else
            RULES="skip"
          fi

          # MCP tools (exclude index.ts — it's the barrel export, not a tool)
          ACD_MCP_TOOLS_DIR_RESOLVED="${ACD_INPUT_MCP_TOOLS_DIR:-mcp-server/src/tools/}"
          if [ "${ACD_INPUT_CHECK_MCP_TOOLS:-true}" = "true" ] && [ -d "$ACD_MCP_TOOLS_DIR_RESOLVED" ]; then
            MCP_TOOLS=$(ls "$ACD_MCP_TOOLS_DIR_RESOLVED"*.ts 2>/dev/null | grep -v index.ts | wc -l | tr -d ' ')
          else
            MCP_TOOLS="skip"
          fi

          # Reusable workflows
          if [ "${ACD_INPUT_CHECK_REUSABLE_WF:-true}" = "true" ]; then
            ACD_WF_PATTERN_RESOLVED="${ACD_INPUT_REUSABLE_WF_PATTERN:-.github/workflows/reusable-*.yml}"
            case "$ACD_WF_PATTERN_RESOLVED" in
              -*|*[[:space:]]*)
                echo "::error::reusable_wf_pattern must be a single token with no leading '-' and no embedded whitespace" >&2
                REUSABLE_WF="invalid"
                ;;
              *)
                shopt -s nullglob
                ACD_WF_MATCHES=( $ACD_WF_PATTERN_RESOLVED )
                shopt -u nullglob
                REUSABLE_WF=${#ACD_WF_MATCHES[@]}
                ;;
            esac
          else
            REUSABLE_WF="skip"
          fi

          echo "skills=$SKILLS"         >> $GITHUB_OUTPUT
          echo "registry=$REGISTRY"     >> $GITHUB_OUTPUT
          echo "agents=$AGENTS"         >> $GITHUB_OUTPUT
          echo "rules=$RULES"           >> $GITHUB_OUTPUT
          echo "mcp_tools=$MCP_TOOLS"   >> $GITHUB_OUTPUT
          echo "reusable_wf=$REUSABLE_WF" >> $GITHUB_OUTPUT

          # Bats test count (run bats --count)
          if command -v npx &>/dev/null && [ -d "scripts/tests" ]; then
            BATS_TESTS=$(npx bats --count scripts/tests 2>/dev/null | tail -1 || echo "skip")
          else
            BATS_TESTS="skip"
          fi
          echo "bats_tests=$BATS_TESTS" >> $GITHUB_OUTPUT

          # MCP test count (from vitest --reporter=json)
          if [ -d "mcp-server" ] && [ -f "mcp-server/package.json" ]; then
            cd mcp-server && npm ci --silent 2>/dev/null && npm run build --silent 2>/dev/null
            MCP_TESTS=$(npx vitest run --reporter=json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('numPassedTests',0))" 2>/dev/null || echo "skip")
            cd ..
          else
            MCP_TESTS="skip"
          fi
          echo "mcp_tests=$MCP_TESTS" >> $GITHUB_OUTPUT

          # Commands count
          if [ -d ".claude/commands/" ]; then
            COMMANDS=$(ls .claude/commands/ | wc -l | tr -d ' ')
          else
            COMMANDS="skip"
          fi
          echo "commands=$COMMANDS" >> $GITHUB_OUTPUT

          echo "=== Actual counts ==="
          [ "$SKILLS"      != "skip" ] && echo "Skills dirs:      $SKILLS"
          [ "$REGISTRY"    != "skip" ] && echo "Registry entries: $REGISTRY"
          [ "$AGENTS"      != "skip" ] && echo "Agents:           $AGENTS"
          [ "$RULES"       != "skip" ] && echo "Detekt rules:     $RULES"
          [ "$MCP_TOOLS"   != "skip" ] && echo "MCP tools:        $MCP_TOOLS"
          [ "$REUSABLE_WF" != "skip" ] && echo "Reusable WFs:     $REUSABLE_WF"
          [ "$BATS_TESTS"  != "skip" ] && echo "Bats tests:       $BATS_TESTS"
          [ "$MCP_TESTS"   != "skip" ] && echo "MCP tests:        $MCP_TESTS"
          [ "$COMMANDS"    != "skip" ] && echo "Commands:         $COMMANDS"

      - name: Check README mentions key counts
        run: |
          README="${ACD_INPUT_README_PATH:-README.md}"
          FAIL=0

          check() {
            local label=$1
            local value=$2
            [ "$value" = "skip" ] && echo "⏭  $label: skipped" && return
            if grep -qE "\b${value}\b" "$README"; then
              echo "✅  $label: $value found in $README"
            else
              echo "❌  $label: $value NOT found in $README"
              FAIL=1
            fi
          }

          check "Skills dirs"        "${{ steps.counts.outputs.skills }}"
          check "Registry entries"   "${{ steps.counts.outputs.registry }}"
          check "Agents"             "${{ steps.counts.outputs.agents }}"
          check "Detekt rules"       "${{ steps.counts.outputs.rules }}"
          check "MCP tools"          "${{ steps.counts.outputs.mcp_tools }}"
          check "Reusable workflows" "${{ steps.counts.outputs.reusable_wf }}"
          check "Commands"           "${{ steps.counts.outputs.commands }}"
          # Note: bats_tests and mcp_tests are NOT checked against README
          # because test counts vary by platform (Windows vs Linux, skips, timeouts).
          # They're gathered for informational logging only.

          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "README is stale. Run /readme-audit --fix in Claude Code to update."
            exit 1
          fi
