name: Documentation Audit

on:
  schedule:
    - cron: '0 10 * * 1'  # Weekly Monday 10am UTC (after doc-monitor at 9am)
  workflow_dispatch:
    inputs:
      waves:
        description: 'Waves to run (comma-separated: 1,2,3)'
        default: '1,2'
        type: string
      with_upstream:
        description: 'Include upstream content validation (Wave 3)'
        default: false
        type: boolean
      layer:
        description: 'Project layer (L0, L1, L2)'
        default: 'L0'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Run documentation audit
        env:
          ACD_INPUT_LAYER: ${{ inputs.layer }}
          ACD_INPUT_WAVES: ${{ inputs.waves }}
          ACD_INPUT_WITH_UPSTREAM: ${{ inputs.with_upstream }}
        run: |
          EXTRA_ARGS=()
          [ "$ACD_INPUT_WITH_UPSTREAM" = "true" ] && EXTRA_ARGS+=(--with-upstream)
          node build/cli/audit-docs.js \
            --project-root "${{ github.workspace }}" \
            --layer "${ACD_INPUT_LAYER:-L0}" \
            --waves "${ACD_INPUT_WAVES:-1,2}" \
            "${EXTRA_ARGS[@]}"

      - name: Upload audit report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doc-audit-report
          path: reports/
          retention-days: 14
