name: L0 CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Wave 1: Fast checks (no deps, <30s) ────────────────────────────────

  commit-lint:
    name: Commit Lint
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-commit-lint.yml
    with:
      valid_scopes: "core,data,ui,feature,ci,deps,release,docs,detekt,mcp,skills,scripts,agents,archive,di,guides,tests,tools"
      squash_merge: true

  readme-audit:
    name: README Audit
    uses: ./.github/workflows/readme-audit.yml

  check-outdated:
    name: Check Outdated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: cd mcp-server && npm ci && npm run build
      - name: Check dependency freshness
        run: node mcp-server/build/cli/check-outdated.js . --format summary || true

  agent-parity:
    name: Agent Parity
    uses: ./.github/workflows/reusable-agent-parity.yml
    with:
      target: project

  copilot-parity:
    name: Copilot Parity
    uses: ./.github/workflows/reusable-copilot-parity.yml

  agent-template-lint:
    name: Agent Template Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate agent templates
        run: bash scripts/sh/validate-agent-templates.sh --show-details

  secret-scan:
    name: Secret Scan (TruffleHog)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install TruffleHog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan for secrets
        run: trufflehog filesystem . --only-verified --fail

  # ── Wave 2: Test suites (parallel) ─────────────────────────────────────

  shell-tests:
    name: Shell Tests (bats)
    uses: ./.github/workflows/reusable-shell-tests.yml

  detekt-rules:
    name: Detekt Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build rules JAR
        working-directory: detekt-rules
        run: chmod +x ./gradlew && ./gradlew jar

      - name: Run rule tests
        working-directory: detekt-rules
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: detekt-test-report
          path: detekt-rules/build/reports/tests/
          retention-days: 7

  mcp-server:
    name: MCP Server
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build TypeScript
        working-directory: mcp-server
        run: npm run build

      - name: Run tests
        working-directory: mcp-server
        run: npm test
        env:
          ANDROID_COMMON_DOC: ${{ github.workspace }}

      - name: Lint
        working-directory: mcp-server
        run: npm run lint

  runtime-consultation-windows:
    name: Runtime Consultation Windows
    uses: ./.github/workflows/runtime-consultation-windows.yml

  # ── Wave 3: Cross-cutting validation ───────────────────────────────────

  skill-registry:
    name: Skill Registry Integrity
    runs-on: ubuntu-latest
    needs: [mcp-server]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Skill Registry Integrity
        run: |
          bash scripts/sh/qg-registry-integrity.sh --project-root . --require-registry

  # ── CI Gate ─────────────────────────────────────────────────────────────
  # Single stable check name for branch-protection required status checks.
  # All other jobs feed into this. Adding/removing/renaming CI jobs never
  # breaks the branch-protection contract.

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - commit-lint
      - readme-audit
      - check-outdated
      - agent-parity
      - copilot-parity
      - secret-scan
      - shell-tests
      - detekt-rules
      - mcp-server
      - runtime-consultation-windows
      - skill-registry
      - agent-template-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          # commit-lint and check-outdated only run on PRs — treat skipped as pass
          results=(
            "${{ needs.readme-audit.result }}"
            "${{ needs.agent-parity.result }}"
            "${{ needs.copilot-parity.result }}"
            "${{ needs.shell-tests.result }}"
            "${{ needs.detekt-rules.result }}"
            "${{ needs.mcp-server.result }}"
            "${{ needs.runtime-consultation-windows.result }}"
            "${{ needs.skill-registry.result }}"
            "${{ needs.agent-template-lint.result }}"
          )
          commit_lint="${{ needs.commit-lint.result }}"
          if [[ "$commit_lint" != "success" && "$commit_lint" != "skipped" ]]; then
            echo "❌ commit-lint: $commit_lint"
            exit 1
          fi
          check_outdated="${{ needs.check-outdated.result }}"
          if [[ "$check_outdated" != "success" && "$check_outdated" != "skipped" ]]; then
            echo "❌ check-outdated: $check_outdated"
            exit 1
          fi
          secret_scan="${{ needs.secret-scan.result }}"
          if [[ "$secret_scan" != "success" && "$secret_scan" != "skipped" ]]; then
            echo "❌ secret-scan: $secret_scan"
            exit 1
          fi
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "❌ One or more required jobs failed or were cancelled."
              echo "Results: ${results[*]}"
              exit 1
            fi
          done
          echo "✅ All CI checks passed."
